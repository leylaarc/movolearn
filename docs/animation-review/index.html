<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Animation review · Movo Learn</title>
  <style>
    :root {
      --navy: #141f47;
      --muted: #3e4468;
      --cream: #fff6db;
      --sky: #8ec8e8;
      --window: #d7efff;
      --coral: #e23b62;
      --orange: #ff7510;
      --yellow: #ffc700;
      --line: rgba(20, 31, 71, 0.14);
      --ok: #1a8f45;
      --ok-wash: #e5f6ea;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--navy);
      background: var(--cream);
      font-family: "Avenir Next", Avenir, "Segoe UI", "Helvetica Neue", sans-serif;
      line-height: 1.4;
    }
    header, main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; }
    header { padding: 28px 0 12px; }
    h1 { font-size: 1.8rem; margin: 0 0 6px; letter-spacing: -0.03em; }
    .lead { margin: 0; max-width: 62ch; color: var(--muted); }
    .bar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      margin: 16px 0 8px;
    }
    .count { font-weight: 700; margin-right: 8px; }
    button, textarea { font: inherit; color: inherit; }
    .filters button, .actions button, .copy {
      border: 1px solid var(--line);
      background: white;
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
    }
    .filters button[aria-pressed="true"] { background: var(--navy); color: white; border-color: var(--navy); }
    main {
      display: grid;
      grid-template-columns: minmax(280px, 380px) 1fr;
      gap: 20px;
      align-items: start;
      padding-bottom: 48px;
    }
    .list {
      background: white;
      border: 1px solid var(--line);
      border-radius: 18px;
      max-height: calc(100vh - 180px);
      overflow: auto;
    }
    .group {
      position: sticky; top: 0;
      background: #f7f4ea;
      padding: 8px 14px;
      font-size: 0.78rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
    }
    .row {
      width: 100%;
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 8px 12px;
      border: 0;
      border-bottom: 1px solid var(--line);
      background: white;
      text-align: left;
      cursor: pointer;
    }
    .row:hover { background: #fffdf6; }
    .row[aria-current="true"] { background: var(--window); }
    .row strong { display: block; }
    .row span { color: var(--muted); font-size: 0.85rem; }
    .mark { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
    .mark.yes { background: var(--ok); }
    .mark.no { background: var(--coral); }
    .thumb, .still { width: 56px; height: 56px; }
    .thumb svg, .still svg { width: 100%; height: 100%; display: block; }
    .stage-wrap {
      position: sticky; top: 16px;
      background: white;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
    }
    .sky {
      height: 280px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: radial-gradient(circle at 50% 45%, #fff, var(--sky) 70%);
    }
    .sky.water { background: radial-gradient(circle at 50% 40%, #e7f6ff, #7eb6d8 72%); }
    .sky.space { background: radial-gradient(circle at 50% 40%, #24315f, #141f47 75%); }
    .sky.volcano { background: radial-gradient(circle at 50% 30%, #ffd7a8, #e7a06a 70%); }
    .sky.ground { background: radial-gradient(circle at 50% 40%, #fff, #d7efc8 78%); }
    .mover { width: 168px; height: 168px; }
    .mover svg { width: 100%; height: 100%; overflow: visible; }
    .stage-copy { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
    .stage-copy .mover { width: 64px; height: 64px; }
    h2 { margin: 14px 0 4px; font-size: 1.45rem; }
    .detail { margin: 0 0 12px; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .actions .yes[aria-pressed="true"] { background: var(--ok-wash); border-color: var(--ok); }
    .actions .no[aria-pressed="true"] { background: #fde8ee; border-color: var(--coral); }
    textarea {
      width: 100%;
      margin-top: 10px;
      border-radius: 12px;
      border: 1px solid var(--line);
      padding: 10px 12px;
      min-height: 72px;
      resize: vertical;
    }
    .hidden { display: none; }
    .mover-flutter { animation: flutter 0.85s ease-in-out infinite alternate; }
    .mover-waddle { animation: waddle 0.42s ease-in-out infinite alternate; }
    .mover-trot { animation: trot 0.72s ease-in-out infinite alternate; }
    .mover-hop { animation: hop 0.48s ease-in-out infinite alternate; }
    .mover-swim { animation: swim 1.4s ease-in-out infinite alternate; }
    .mover-roll { animation: roll 0.85s ease-in-out infinite alternate; }
    .mover-drive { animation: drive 1.15s ease-in-out infinite alternate; }
    .mover-bob { animation: bob 1.2s ease-in-out infinite alternate; }
    .mover-rest { animation: rest 2s ease-in-out infinite alternate; }
    .mover-twinkle { animation: twinkle 0.75s ease-in-out infinite alternate; }
    .mover-float { animation: float 1.7s ease-in-out infinite alternate; }
    .mover-glide { animation: glide 1.45s ease-in-out infinite alternate; }
    .life-spin, .life-flip, .life-wag, .life-wing { transform-box: fill-box; transform-origin: center; }
    .life-spin { animation: spin 4.5s linear infinite; }
    .life-flip { animation: flip 1.6s ease-in-out infinite; }
    .life-smoke { animation: smoke 1.6s ease-in-out infinite alternate; }
    .life-blink { animation: blink 0.9s ease-in-out infinite alternate; }
    .life-wag { animation: wag 0.45s ease-in-out infinite alternate; }
    .life-wing { animation: wing 0.42s ease-in-out infinite alternate; }
    .life-flap-left, .life-flap-right { transform-box: fill-box; }
    .life-flap-left { animation: flap-left 0.38s ease-in-out infinite alternate; }
    .life-flap-right { animation: flap-right 0.38s ease-in-out infinite alternate; }
    @keyframes flutter { to { transform: translateY(-16px) rotate(-12deg); } }
    @keyframes waddle { from { transform: translateX(-8px) rotate(-7deg); } to { transform: translateX(8px) rotate(7deg); } }
    @keyframes trot { to { transform: translate(16px, -6px) rotate(3deg); } }
    @keyframes hop { to { transform: translateY(-26px); } }
    @keyframes swim { to { transform: translate(24px, -8px) rotate(6deg); } }
    @keyframes roll { to { transform: translateX(16px) rotate(20deg); } }
    @keyframes drive { to { transform: translateX(22px); } }
    @keyframes bob { to { transform: translateY(-12px); } }
    @keyframes rest { to { transform: translateY(-4px); } }
    @keyframes twinkle { to { transform: translateY(-8px); opacity: 0.55; } }
    @keyframes float { to { transform: translateY(-28px); } }
    @keyframes glide { to { transform: translate(26px, -12px) rotate(-5deg); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes flip { 50% { transform: scaleX(0.22); } }
    @keyframes smoke { to { transform: translateY(-12px); opacity: 0.35; } }
    @keyframes blink { to { opacity: 0.2; } }
    @keyframes wag { to { transform: rotate(16deg); } }
    @keyframes wing { to { transform: rotate(-18deg); } }
    @keyframes flap-left { from { transform: rotate(14deg); } to { transform: rotate(46deg); } }
    @keyframes flap-right { from { transform: rotate(-14deg); } to { transform: rotate(-46deg); } }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; }
      .list { max-height: none; }
      .stage-wrap { position: static; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Animation review</h1>
    <p class="lead">Every picture a lesson can show. The list stays still. Open one to watch how it moves, then approve it or mark what should change. Your marks stay in this browser.</p>
    <div class="bar">
      <div class="count" id="progress">Loading</div>
      <div class="filters" role="group" aria-label="Filter">
        <button type="button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" data-filter="open" aria-pressed="false">Still to review</button>
        <button type="button" data-filter="yes" aria-pressed="false">Approved</button>
        <button type="button" data-filter="no" aria-pressed="false">Needs a change</button>
      </div>
      <button class="copy" type="button" id="copy">Copy decisions</button>
    </div>
  </header>
  <main>
    <div class="list" id="list"></div>
    <section class="stage-wrap" aria-live="polite">
      <div class="sky" id="sky"></div>
      <div class="stage-copy" id="copies"></div>
      <h2 id="title">Picture</h2>
      <p class="detail" id="detail"></p>
      <div class="actions">
        <button type="button" class="yes" id="approve">Approve</button>
        <button type="button" class="no" id="reject">Needs a change</button>
      </div>
      <textarea id="note" class="hidden" placeholder="What should be different?"></textarea>
    </section>
  </main>
  <script>
    const MOTION = {
      flutter: ["Flutters", "Lifts and tips, the way wings do."],
      waddle: ["Waddles", "Short steps from side to side."],
      trot: ["Trots", "A longer stride, with a small lift."],
      hop: ["Hops", "Jumps up, then comes back down."],
      swim: ["Swims", "Glides ahead and rises a little."],
      roll: ["Rolls", "Turns as it moves."],
      drive: ["Drives", "Moves ahead without tipping over."],
      bob: ["Bobs", "A small, slow lift."],
      rest: ["Stays put", "Settles in place so it is easy to count."],
      twinkle: ["Twinkles", "Brightens, dims, and lifts a little."],
      float: ["Floats", "Drifts slowly up and down."],
      glide: ["Glides", "Travels across the sky and rises a little."]

    const LIFE = {

    const NOTES = {

    const GROUPS = [

      ]],

    function item(id, name, motion, art, life, extra) {
      return { id, name, motion, art, life: life || "", extra: extra || {} };
    }

    const ITEMS = GROUPS.flatMap(([group, rows]) => rows.map((row) => ({ ...row, group })));

    function svg(inner) {
      return `<svg viewBox="0 0 80 80" aria-hidden="true">${inner}</svg>`;
    }
    function g(play, life, inner, origin) {
      const style = origin ? ` style="transform-origin:${origin}"` : "";
      return play && life ? `<g class="life life-${life}"${style}>${inner}</g>` : inner;
    }
    function eye(x, y, s) {
      return `<circle cx="${x}" cy="${y}" r="${s}" fill="#d7efff"/><circle cx="${x + s * 0.3}" cy="${y}" r="${s * 0.45}" fill="#141f47"/>`;
    }

    let globeSerial = 0;
    const ART = {
      shark: (it, play) => fish("#457394", true, play),
      dolphin: (it, play) => mammalTail("#2e9ec7", play, false),

    function fish(color, fin, play) {
      const tail = g(play, "wag", `<path d="M36 42 L4 16 L22 42 L4 68 Z" fill="${color}"/>`);
      const dorsal = fin ? `<polygon points="36,30 44,30 40,16" fill="${color}"/>` : "";
      const gills = fin ? `<g fill="none" stroke="#1a3344" stroke-width="1.6" stroke-linecap="round"><path d="M44 36 Q42 42 44 48"/><path d="M47.5 35.5 Q45.5 42 47.5 48.5"/><path d="M51 36 Q49 42 51 48"/></g>` : "";
      return `${tail}<ellipse cx="46" cy="42" rx="18" ry="${fin ? 12 : 10}" fill="${color}"/>${dorsal}<ellipse cx="46" cy="48" rx="10" ry="4" fill="#d7efff" opacity="0.7"/>${gills}${eye(56, 38, 3)}`;
    }
    function mammalTail(color, play, whale) {
      const flukes = whale
        ? g(play, "wag", `<path d="M36 42 C22 42 14 12 4 20 C1 30 8 40 14 42 C8 44 1 54 4 64 C14 72 22 42 36 42 Z" fill="${color}"/>`, "100% 50%")
        : g(play, "wag", `<path d="M38 37 L18 36 C16 30 7 28 3 32 C1 36 9 40 16 41 C9 42 1 47 3 51 C7 55 16 50 18 46 L38 47 Z" fill="${color}"/>`, "100% 50%");
      const body = whale
        ? `<ellipse cx="44" cy="44" rx="24" ry="16" fill="${color}"/>`
        : `<ellipse cx="46" cy="42" rx="20" ry="11" fill="${color}"/><ellipse cx="66" cy="44" rx="12" ry="3.2" fill="${color}"/>`;
      const dorsal = whale ? "" : `<path d="M38 34 Q44 18 50 32 Q45 30 38 34 Z" fill="${color}"/>`;
      const spout = whale ? `<circle cx="36" cy="26" r="3" fill="#d7efff"/><circle cx="44" cy="20" r="2" fill="#d7efff"/>` : "";
      return `${flukes}${body}${dorsal}${spout}${eye(56, 38, 3)}`;
    }
    function pentagon(cx, cy, radius, turn) {
      const points = [];
      for (let index = 0; index < 5; index += 1) {
        const angle = ((index * 72 - 90 + turn) * Math.PI) / 180;
        points.push(`${cx + Math.cos(angle) * radius},${cy + Math.sin(angle) * radius}`);
      }
      return `<polygon points="${points.join(" ")}" fill="#141f47"/>`;
    }
    function ballFace(pattern) {
      if (pattern === "soccer") {
        const id = `soccer${ballFace.serial = (ballFace.serial || 0) + 1}`;
        const patches = [0, 1, 2, 3, 4].map((index) => {
          const angle = ((index * 72 - 90) * Math.PI) / 180;
          return pentagon(40 + Math.cos(angle) * 13, 40 + Math.sin(angle) * 13, 4.2, index * 72 + 36);
        }).join("");
        return `<defs><clipPath id="${id}"><circle cx="40" cy="40" r="16"/></clipPath></defs><g clip-path="url(#${id})"><circle cx="40" cy="40" r="16" fill="#fff"/>${pentagon(40, 40, 5, 0)}${patches}</g><circle cx="40" cy="40" r="16" fill="none" stroke="#141f47" stroke-width="2"/>`;
      }
      if (pattern === "basketball") {
        const id = `hoop${ballFace.serial = (ballFace.serial || 0) + 1}`;
        return `<defs><clipPath id="${id}"><circle cx="40" cy="40" r="15.2"/></clipPath></defs><circle cx="40" cy="40" r="16" fill="#ff7510"/><g clip-path="url(#${id})" fill="none" stroke="#141f47" stroke-width="2"><path d="M40 24 V56 M25 40 H55"/><path d="M31 26 Q35 40 31 54"/><path d="M49 26 Q45 40 49 54"/></g><circle cx="40" cy="40" r="16" fill="none" stroke="#141f47" stroke-width="2"/>`;
      }
      if (pattern === "tennis") {
        return `<circle cx="40" cy="40" r="16" fill="#c7e638"/><path d="M32 26 Q26 40 32 54" fill="none" stroke="#fff" stroke-width="2"/><path d="M48 26 Q54 40 48 54" fill="none" stroke="#fff" stroke-width="2"/>`;
      }
      const id = `yarn${ballFace.serial = (ballFace.serial || 0) + 1}`;
      const loops = Array.from({ length: 16 }, (_, index) => {
        const radius = 3.5 + (index % 6) * 2;
        const cx = 40 + ((index % 5) - 2) * 3.2;
        const cy = 40 + ((index % 4) - 1.5) * 3.6;
        return `<circle cx="${cx}" cy="${cy}" r="${radius}"/>`;
      }).join("");
      return `<defs><clipPath id="${id}"><circle cx="40" cy="40" r="15.2"/></clipPath></defs><circle cx="40" cy="40" r="16" fill="#b9a7e6"/><g clip-path="url(#${id})" fill="none" stroke="#efe8ff" stroke-width="1.6">${loops}</g>`;
    }
    function star(color) {
      const points = [];
      for (let index = 0; index < 10; index += 1) {
        const angle = ((index * 36 - 90) * Math.PI) / 180;
        const radius = index % 2 === 0 ? 22 : 9;
        points.push(`${(40 + Math.cos(angle) * radius).toFixed(1)},${(40 + Math.sin(angle) * radius).toFixed(1)}`);
      }
      return `<polygon points="${points.join(" ")}" fill="${color}"/>`;
    }
    function bone(color) {
      return `<rect x="24" y="36" width="32" height="8" rx="4" fill="${color}"/><circle cx="24" cy="34" r="6" fill="${color}"/><circle cx="24" cy="46" r="6" fill="${color}"/><circle cx="56" cy="34" r="6" fill="${color}"/><circle cx="56" cy="46" r="6" fill="${color}"/>`;
    }
    function beast(body, belly, ear, play, life, lift, hair, earColor) {
      const mane = hair || "#472410";
      const ears = ear === "flop"
        ? `<ellipse cx="50" cy="40" rx="4.5" ry="9" fill="${earColor}" transform="rotate(22 50 40)"/><ellipse cx="55" cy="36" rx="4" ry="8" fill="${earColor}" transform="rotate(8 55 36)"/>`
        : ear === "point"
          ? `<polygon points="52,34 56,18 60,34" fill="${body}"/>`
          : ear === "round"
            ? `<circle cx="56" cy="30" r="4" fill="${body}"/>`
            : "";
      const fringe = ear === "mane"
        ? `<rect x="39" y="35" width="15" height="4" rx="2" fill="${mane}" transform="rotate(-36 46 37)"/>`
        : "";
      const points = ear === "mane"
        ? `<polygon points="53,33 55.5,26 58,33" fill="${body}"/><polygon points="58,32 61,25 64,32" fill="${body}"/>`
        : "";
      const tail = ear === "mane"
        ? `<path d="M27 39 C21 48 15 58 14 68 C17 75 23 73 23 66 C23 56 25 48 31 41 Z" fill="${mane}"/>`
        : lift
          ? `<g transform="rotate(42 30 47)"><rect x="1" y="45.5" width="29" height="3" rx="1.5" fill="${body}"/></g>`
          : `<rect x="12" y="44" width="16" height="6" rx="3" fill="${body}"/>`;
      const pivot = ear === "mane" ? "50% 0%" : lift ? "100% 50%" : "";
      const legs = ear === "mane" || ear === "flop"
        ? [26, 32.5, 44, 50.5].map((x) => `<rect x="${x}" y="54" width="4.2" height="13" rx="2.1" fill="${body}"/>`).join("")
        : "";
      const tongue = ear === "flop" ? `<ellipse cx="65" cy="46" rx="1.05" ry="2" fill="#ff8fb8"/>` : "";
      return `${g(play, life || "wag", tail, pivot)}${legs}<ellipse cx="40" cy="48" rx="20" ry="12" fill="${body}"/><ellipse cx="40" cy="52" rx="10" ry="6" fill="${belly}"/>${fringe}<circle cx="58" cy="38" r="9" fill="${body}"/>${ears}${points}${eye(62, 36, 2)}${tongue}`;
    }
    function bird(body, belly, comb, play, life) {
      const top = comb ? `<polygon points="56,24 60,16 64,26" fill="#e23b62"/>` : "";
      return `${g(play, life || "wing", `<ellipse cx="24" cy="42" rx="14" ry="7" fill="${body}"/>`)}<ellipse cx="40" cy="46" rx="16" ry="12" fill="${body}"/><ellipse cx="40" cy="50" rx="8" ry="6" fill="${belly}"/><circle cx="56" cy="38" r="8" fill="${body}"/>${top}${eye(60, 36, 2)}<rect x="62" y="36" width="10" height="4" rx="2" fill="#ff7510"/>`;
    }
    function bloom(color) {
      return [0, 72, 144, 216, 288].map((d) => `<ellipse cx="40" cy="24" rx="6" ry="12" fill="${color}" transform="rotate(${d} 40 40)"/>`).join("") + `<rect x="37" y="40" width="6" height="22" fill="#339e5c"/><circle cx="40" cy="40" r="5" fill="#ffc700"/>`;
    }
    function fruit(color) {
      return `<circle cx="40" cy="44" r="14" fill="${color}"/><ellipse cx="48" cy="30" rx="6" ry="3" fill="#339e5c" transform="rotate(-30 48 30)"/>`;
    }

    const SKY = {
      swim: "water", float: "space", glide: "sky", flutter: "sky", twinkle: "space"
    };
    const NAMED_SKY = { volcano: "volcano", lava: "volcano", rock: "volcano", cloud: "sky", sun: "sky", ship: "water", hero: "sky", airplane: "sky", rocket: "sky", bird: "sky", fairy: "sky", butterfly: "sky", leaf: "sky", petal: "sky", octopus: "water", lighthouse: "water", earth: "space", venus: "space", spacecraft: "space", hawk: "sky" };

    const storeKey = "movo-animation-review-v1";
    const saved = JSON.parse(localStorage.getItem(storeKey) || "{}");
    let filter = "all";
    let current = ITEMS[0].id;

    function skyFor(it) {
      return NAMED_SKY[it.id] || SKY[it.motion] || "ground";
    }
    function frame(it, play) {
      const draw = ART[it.art](it, play);
      const cls = play ? `mover mover-${it.motion}` : "still";
      return `<div class="${cls}">${svg(draw)}</div>`;
    }
    function statusOf(id) { return saved[id] && saved[id].status; }
    function persist() { localStorage.setItem(storeKey, JSON.stringify(saved)); }

    function renderList() {
      const list = document.getElementById("list");
      const parts = [];
      let shown = 0;
      for (const [group, rows] of GROUPS) {
        const visible = rows.filter((row) => {
          const status = statusOf(row.id) || "open";
          if (filter === "all") return true;
          if (filter === "open") return status !== "yes" && status !== "no";
          return status === filter;
        });
        if (!visible.length) continue;
        shown += visible.length;
        parts.push(`<div class="group">${group}</div>`);
        for (const row of visible) {
          const status = statusOf(row.id);
          parts.push(`<button class="row" type="button" data-id="${row.id}"${row.id === current ? ' aria-current="true"' : ""}>
            <span class="thumb">${frame(row, false)}</span>
            <span><strong>${row.name}</strong><span>${MOTION[row.motion][0]}</span></span>
            <i class="mark ${status || ""}"></i>
          </button>`);
        }
      }
      list.innerHTML = parts.join("") || `<p class="group">Nothing in this filter.</p>`;
      const yes = ITEMS.filter((it) => statusOf(it.id) === "yes").length;
      const no = ITEMS.filter((it) => statusOf(it.id) === "no").length;
      document.getElementById("progress").textContent = `${yes} approved · ${no} need a change · ${ITEMS.length - yes - no} still to review`;
      if (!shown && filter !== "all") return;
    }

    function renderStage() {
      const it = ITEMS.find((row) => row.id === current) || ITEMS[0];
      current = it.id;
      const sky = document.getElementById("sky");
      sky.className = `sky ${skyFor(it)}`;
      sky.innerHTML = frame(it, true);
      document.getElementById("copies").innerHTML = [0, 1, 2].map(() => frame(it, true)).join("");
      const [label, sentence] = MOTION[it.motion];
      const extra = [sentence, it.life && LIFE[it.life], NOTES[it.id]].filter(Boolean).join(" ");
      document.getElementById("title").textContent = it.name;
      document.getElementById("detail").textContent = `${label}. ${extra}`;
      const status = statusOf(it.id);
      document.getElementById("approve").setAttribute("aria-pressed", String(status === "yes"));
      document.getElementById("reject").setAttribute("aria-pressed", String(status === "no"));
      const note = document.getElementById("note");
      note.classList.toggle("hidden", status !== "no");
      note.value = (saved[it.id] && saved[it.id].note) || "";
    }

    function select(id) {
      current = id;
      renderList();
      renderStage();
      const row = document.querySelector(`.row[data-id="${CSS.escape(id)}"]`);
      if (row) row.scrollIntoView({ block: "nearest" });
    }

    document.getElementById("list").addEventListener("click", (event) => {
      const row = event.target.closest(".row");
      if (row) select(row.dataset.id);
    });
    document.querySelectorAll(".filters button").forEach((button) => {
      button.addEventListener("click", () => {
        filter = button.dataset.filter;
        document.querySelectorAll(".filters button").forEach((other) => {
          other.setAttribute("aria-pressed", String(other === button));
        });
        renderList();
      });
    });
    document.getElementById("approve").addEventListener("click", () => {
      saved[current] = { status: "yes", note: "" };
      persist();
      const index = ITEMS.findIndex((row) => row.id === current);
      const next = ITEMS.slice(index + 1).find((row) => !statusOf(row.id)) || ITEMS[index];
      current = next.id;
      renderList();
      renderStage();
    });
    document.getElementById("reject").addEventListener("click", () => {
      saved[current] = { status: "no", note: (saved[current] && saved[current].note) || "" };
      persist();
      renderList();
      renderStage();
      document.getElementById("note").focus();
    });
    document.getElementById("note").addEventListener("input", (event) => {
      if (!saved[current]) saved[current] = { status: "no", note: "" };
      saved[current].note = event.target.value;
      persist();
    });
    document.getElementById("copy").addEventListener("click", async () => {
      const lines = ITEMS.map((it) => {
        const status = statusOf(it.id);
        if (!status) return `${it.name}: not reviewed`;
        const note = saved[it.id].note ? ` — ${saved[it.id].note}` : "";
        return `${it.name}: ${status === "yes" ? "approved" : "needs a change"}${note}`;
      });
      await navigator.clipboard.writeText(lines.join("\n"));
      document.getElementById("copy").textContent = "Copied";
      setTimeout(() => { document.getElementById("copy").textContent = "Copy decisions"; }, 1200);
    });
    document.addEventListener("keydown", (event) => {
      if (event.target.matches("textarea")) return;
      const visible = [...document.querySelectorAll(".row")].map((row) => row.dataset.id);
      const index = visible.indexOf(current);
      if (event.key === "ArrowDown" || event.key === "ArrowRight") {
        event.preventDefault();
        select(visible[Math.min(visible.length - 1, index + 1)] || current);
      }
      if (event.key === "ArrowUp" || event.key === "ArrowLeft") {
        event.preventDefault();
        select(visible[Math.max(0, index - 1)] || current);
      }
    });

    renderList();
    renderStage();
  </script>
</body>
</html>
